<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Giriş | Neoline Technology</title>
    <style>
        :root { --p: #6366f1; --dark: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .login-card { background: white; padding: 45px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        .logo-box { width: 80px; height: 80px; background: var(--p); margin: 0 auto 25px; border-radius: 20px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 40px; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        h2 { color: var(--dark); margin-bottom: 5px; font-weight: 800; }
        p { color: #64748b; margin-bottom: 30px; font-size: 14px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--p); outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        button { width: 100%; padding: 14px; background: var(--p); border: none; color: white; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #4f46e5; transform: translateY(-2px); }
        .alert { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">N</div>
        <h2>Neoline</h2>
        <p>Technology Ticket System</p>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="İstifadəçi adı" required>
            <input type="password" name="password" placeholder="Şifrə" required>
            <button type="submit">Daxil Ol</button>
        </form>
    </div>
</body>
</html>
