<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Yeni Müraciət | Neoline Technology</title>
    <style>
        :root { --p: #6366f1; --dark: #0f172a; --s: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 20px; width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .logo-center { text-align: center; margin-bottom: 25px; }
        .logo-icon { background: var(--p); color: white; width: 60px; height: 60px; line-height: 60px; border-radius: 16px; font-weight: 800; font-size: 24px; margin: 0 auto 12px; display: block; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
        label { font-size: 14px; color: #64748b; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .btn-send { width: 100%; background: var(--s); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-send:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-center">
            <div class="logo-icon">N</div>
            <h2 style="color:var(--dark); margin:0; font-weight: 800;">Neoline</h2>
            <small style="color:gray;">Technology Support</small>
        </div>
        <form method="POST" enctype="multipart/form-data">
            <label>Mövzu</label><input type="text" name="title" placeholder="Başlıq daxil edin" required>
            <label>Açıqlama</label><textarea name="description" rows="5" placeholder="Problem barədə ətraflı..." required></textarea>
            <label>Fayl əlavə et</label><input type="file" name="file">
            <button type="submit" class="btn-send">Müraciəti Göndər</button>
            <a href="/" style="display:block; text-align:center; margin-top:20px; color:#64748b; text-decoration:none; font-size: 14px;">✕ İmtina et</a>
        </form>
    </div>
</body>
</html>
