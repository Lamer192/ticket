<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>İstifadəçi Yarat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 12px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4e73df; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align:center; color:#333;">Yeni İstifadəçi</h2>
        <form method="POST">
            <input type="text" name="u" placeholder="İstifadəçi adı" required>
            <input type="password" name="p" placeholder="Şifrə" required>
            <select name="r">
                <option value="user">İstifadəçi</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Yarat</button>
            <a href="/" style="display:block; text-align:center; margin-top:15px; color:#666; text-decoration:none;">Geri</a>
        </form>
    </div>
</body>
</html>
